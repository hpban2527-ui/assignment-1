name: Lab2 FastAPI contract tests
on:
  push:
    paths:
      - 'lab2-sentiment-fastapi/**'
      - '.github/workflows/lab2-api-tests.yml'
  pull_request:
    paths:
      - 'lab2-sentiment-fastapi/**'
      - '.github/workflows/lab2-api-tests.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab2-sentiment-fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pytest -q
