name: Lab2 REAL Hugging Face integration
on:
  push:
    paths:
      - 'lab2-sentiment-fastapi/**'
      - '.github/workflows/lab2-real-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-model-and-http:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: lab2-sentiment-fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference dependencies
        run: python -m pip install -r requirements.txt
      - name: Test actual pre-trained Hugging Face model (not mock)
        shell: bash
        run: |
          set -euo pipefail
          printf 'GitHub run: %s\nGit commit: %s\nModel: Xenova/distilbert-base-uncased-finetuned-sst-2-english\nDate UTC: %s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u -Is)" > real_evidence.txt
          python check_real_model.py 2>&1 | tee -a real_evidence.txt
      - name: Test FastAPI over real HTTP with requests
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          python - <<'PY'
          import requests, time
          for _ in range(60):
              try:
                  if requests.get('http://127.0.0.1:8000/health', timeout=2).status_code == 200:
                      break
              except requests.RequestException:
                  time.sleep(1)
          else:
              raise SystemExit('Server never became ready')
          PY
          python test_api.py --base-url http://127.0.0.1:8000 2>&1 | tee -a real_evidence.txt
      - name: Upload measured execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab2-real-huggingface-evidence
          path: |
            lab2-sentiment-fastapi/real_evidence.txt
            lab2-sentiment-fastapi/uvicorn.log
          if-no-files-found: warn
