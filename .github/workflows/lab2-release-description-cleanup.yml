name: Clean Lab 2 release attachments
on:
  push:
    paths:
      - '.github/workflows/lab2-release-description-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    if: github.ref == 'refs/heads/cleanup/lab2-student-submission-description-20261103'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove non-submission report attachment from final video release
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/releases/432925683/assets" --jq '.[].name' | grep -Fx 'final_video_qa.json'; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/706221432"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/432925683" --jq '.assets[].name' > /tmp/release-assets.txt
          grep -Fx 'LAB2_FINAL_25127009.mp4' /tmp/release-assets.txt
          if grep -E '^final_video_qa\.json$' /tmp/release-assets.txt; then
            echo 'Non-submission QA asset still present'
            exit 1
          fi
          echo 'FINAL_RELEASE_CONTAINS_ONLY_MP4'
