name: Lab 2 — API tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: API unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run tests
        run: python -m pytest -q

  real-inference-and-http:
    name: Real Hugging Face model + HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify real pretrained model
        run: python check_real_model.py
      - name: Test running FastAPI with requests
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/lab2_uvicorn.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          python - <<'PY'
          import time
          import requests

          for _ in range(60):
              try:
                  if requests.get("http://127.0.0.1:8000/health", timeout=2).status_code == 200:
                      break
              except requests.RequestException:
                  pass
              time.sleep(1)
          else:
              raise SystemExit("FastAPI server did not become ready")
          PY
          python test_api.py --base-url http://127.0.0.1:8000
